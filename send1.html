<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 匿名意見投遞 - tssc13th胡台校意見箱</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #1e293b;
        }
        .form-group input[type="text"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #d49a00;
        }
        .submit-btn {
            width: 100%;
            background: #d49a00;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .submit-btn:hover {
            background: #b88600;
        }
        .submit-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }
        @media (max-width: 600px) {
            .form-card { padding: 20px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="tpshcmcsc.png" alt="會徽" class="site-logo" style="width: 70px; height: auto; vertical-align: middle; filter: brightness(0);">
                <span class="brand-text">TSSC13TH 胡台校意見箱</span>
            </a>
            <a href="index.html" class="nav-item">返回首頁</a>
        </div>
    </nav>

    <header class="hero-header">
        <h1>🔒 匿名意見投遞</h1>
        <p class="hero-subtitle">無需填寫個人資料，您的意見將以完全匿名的方式提交給學生會</p>
    </header>

    <main class="container" style="display: block; max-width: 600px;">
        <form id="anonymousForm" class="form-card">
            <div class="form-group">
                <label for="assignee">指定處理人員 / 部門（選填）：</label>
                <input type="text" id="assignee" placeholder="例如：會長、活動組（若無指定可留空）">
            </div>

            <div class="form-group">
                <label for="category">意見類別：</label>
                <select id="category" required>
                    <option value="" disabled selected>請選擇類別</option>
                    <option value="活動建議">活動建議</option>
                    <option value="校園設施">校園設施</option>
                    <option value="規範權益">規範權益</option>
                    <option value="其他">其他</option>
                </select>
            </div>

            <div class="form-group">
                <label for="content">意見內容：</label>
                <textarea id="content" rows="5" required placeholder="在此輸入您想反映的內容..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">確認送出</button>
        </form>
    </main>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyX_GsvbBdSfWdLYHys0beIzngkABgNmQq49YXd9ukuXAVGZzfS75yMQ33AkP0yoPrL/exec';
        // 指定遠端鎖定 Control Sheet ID
        const TARGET_SHEET_ID = '18fxfF-BnNlDnhCH0NORbNeWXKSo1KHmljfPCkpvJTKo';
        let statusInterval = null;

        // 觸發系統自動鎖定並停止運行
        function handleSystemErrorAndLock(reason) {
            console.error('系統狀態檢測異常，啟動安全鎖定機制:', reason);
            if (statusInterval) {
                clearInterval(statusInterval); // 停止定時輪詢
            }
            alert('系統連線異常，請聯繫學生會，安全起見，系統將自動上鎖');
            window.location.href = 'lock.html';
        }

        // 🔒 遠端系統狀態檢測（1秒秒鎖機制，含無法獲取狀態時自動停止與鎖定機制）
        function checkSystemStatus() {
            fetch(`${GAS_URL}?action=checkLockStatus&spreadsheetId=${TARGET_SHEET_ID}&_t=${Date.now()}`)
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`HTTP 錯誤 Status: ${res.status}`);
                    }
                    return res.json();
                })
                .then(data => {
                    if (data && typeof data.locked !== 'undefined') {
                        if (data.locked === true) {
                            if (statusInterval) clearInterval(statusInterval);
                            window.location.href = 'lock.html';
                        } else if (data.maintenance === true) {
                            if (statusInterval) clearInterval(statusInterval);
                            window.location.href = 'maintenance.html';
                        }
                    } else {
                        // 回傳格式不符或無法獲取正確布林狀態，自動停止並鎖定
                        handleSystemErrorAndLock('無效的回傳資料格式');
                    }
                })
                .catch(err => {
                    // 網路斷線或無法獲取狀態，自動停止並跳轉鎖定
                    handleSystemErrorAndLock(err.message || '連線失敗');
                });
        }

        // 頁面載入時執行一次，並設置每 1 秒定期檢測
        window.onload = function() {
            checkSystemStatus();
            statusInterval = setInterval(checkSystemStatus, 1000);
        };

        // 表單提交處理
        document.getElementById('anonymousForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const assigneeVal = document.getElementById('assignee').value.trim();
            const contentVal = document.getElementById('content').value.trim();

            if (!contentVal) {
                alert('請輸入意見內容！');
                return;
            }

            const formData = {
                action: 'addFeedback',
                type: 'anonymous',
                name: '匿名',
                class_name: '',
                email: '',
                target_assignee: assigneeVal === '' ? '學生會' : assigneeVal,
                assignee: assigneeVal === '' ? '學生會' : assigneeVal,
                category: document.getElementById('category').value,
                content: contentVal
            };

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = '處理中，請稍候...';

            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(formData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('意見已成功匿名送出！');
                    document.getElementById('anonymousForm').reset();
                    window.location.href = 'replies.html';
                } else {
                    alert('送出失敗：' + (data.error || '未知錯誤'));
                }
            })
            .catch(err => {
                console.error(err);
                alert('連線發生錯誤，請稍後再試！');
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = '確認送出';
            });
        });
    </script>
</body>
</html>
